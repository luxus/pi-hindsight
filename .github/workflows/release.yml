name: Release

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm after verification
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Run checks
        run: npm run check

      - name: Run coverage gate
        run: npm run check:coverage

      - name: Run TypeScript compiler fallback
        run: npm run typecheck:tsc

      - name: Verify registry signatures
        if: matrix.os == 'ubuntu-latest'
        run: npm run audit:signatures

      - name: Verify release metadata and package install
        if: matrix.os == 'ubuntu-latest'
        run: npm run pack:verify

  publish:
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Publish package
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already exists on npm; skipping publish."
            exit 0
          fi
          npm publish --provenance --access public
